name: Deploy to Azure Function

# main'e her push'ta: test HER ZAMAN çalışır. Testler geçerse ve deploy hedefi
# tanımlıysa deploy edilir.
# Kurulum (bir kere, deploy'u açmak için):
#   - Repo variable: AZURE_FUNCTIONAPP_NAME = <function app adı>
#   - Repo secret:   AZURE_FUNCTIONAPP_PUBLISH_PROFILE = <publish profile XML>
# Değişken tanımlı değilse yalnızca deploy job'u atlanır — test yine çalışır.
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "host.json"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - run: python -c "import function_app; print('function_app import OK')"
      - run: pytest

  deploy:
    needs: test          # testler geçmeden deploy YAPILMAZ
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_FUNCTIONAPP_NAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
