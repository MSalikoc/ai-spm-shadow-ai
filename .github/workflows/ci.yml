name: CI

# Runs automatically on pull requests: compile + import smoke + pytest.
# Catches import/dependency errors before a deployment does.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile all sources
        run: python -m compileall -q .
      - name: Import smoke (catches missing modules)
        run: python -c "import function_app; print('function_app import OK')"
      - name: Run tests
        run: pytest
