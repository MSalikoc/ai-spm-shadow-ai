name: Build & Release Function Package

# v* tag'i push edildiğinde (ör. v0.1.0) self-contained zip üretip
# GitHub Release'e "aispm-function.zip" olarak ekler.
# ARM template'teki packageUri bu asset'i gösterir:
#   https://github.com/<OWNER>/<REPO>/releases/latest/download/aispm-function.zip
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları gömülü kur (RUN_FROM_PACKAGE pip çalıştırmaz)
        run: |
          python -m pip install --upgrade pip
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Zip paketi oluştur
        run: |
          zip -r aispm-function.zip \
            function_app.py host.json requirements.txt \
            auth.py collectors.py config.py graph_client.py \
            pipeline.py report.py scoring.py storage.py \
            .python_packages \
            -x "*.pyc" "*/__pycache__/*"

      - name: Release oluştur / güncelle
        uses: softprops/action-gh-release@v2
        with:
          files: aispm-function.zip
          generate_release_notes: true
